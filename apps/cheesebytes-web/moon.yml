language: javascript

# Astro has a build script but no generic test script, so don't inherit the
# TypeScript test/build pair blindly.
workspace:
  inheritedTasks:
    exclude:
      - test
      - build

tasks:
  build:
    command: "pnpm build"
    inputs:
      - "src/**/*"
      - "public/**/*"
      - "package.json"
      - "astro.config.*"
      - "tsconfig.json"
      - "/pnpm-lock.yaml"
    outputs:
      - "dist/**/*"
    options:
      runInCI: affected

  publish-to-repo:
    command: "bash ../../.moon/scripts/publish_cheesebytes_web.sh"
    inputs:
      - "**/*"
      - "/notes/Cheese Bytes/**/*"
      - "/.moon/scripts/publish_cheesebytes_web.sh"
    deps:
      - build
    options:
      cache: false
      runInCI: false

  record-audio:
    command: "uv run python .moon/scripts/record_cheesebytes_audio.py"
    inputs: []
    preset: utility
    options:
      runFromWorkspaceRoot: true

  dev:
    command: "pnpm run dev"
    preset: server
